<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            width: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            text-align: center;
            vertical-align: middle;
            font-size: 24px;
            font-family: sans-serif;
            width: 50%;
        }
        .cell-one {
            background-color: #4CAF50;
            color: white;
        }
        .cell-two {
            background-color: #2196F3;
            color: white;
        }

        @media (max-width: 600px) {
            tr {
                display: flex;
                flex-direction: column;
                height: 100%;
                width: 100%;
            }
            td {
                width: 100%;
                height: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-one">First cell</td>
            <td class="cell-two">Second cell</td>
        </tr>
    </table>

</body>
</html>
