<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>
    <div class="parallax bg1">
        <div class="caption">
            <span>First Image</span>
        </div>
    </div>

    <div class="block">
        <h3>This is a black block</h3>
        <p>Scroll down to see the next image.</p>
    </div>

    <div class="parallax bg2">
        <div class="caption">
            <span>Second Image</span>
        </div>
    </div>
</body>
</html>
