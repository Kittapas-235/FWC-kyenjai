<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            padding: 20px;
        }
        h1 {
            color: white;
            text-align: center;
        }
        .shops-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }
        .shop-item {
            text-align: center;
        }
        .shop-item img {
            width: 250px;
            height: 150px;
            object-fit: contain;
            display: block;
            margin-bottom: 10px;
        }
        hr {
            border: 0;
            border-top: 1px solid #ffffff;
            width: 100%;
            margin: 30px 0 10px 0;
        }
        .footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>Welcome to The Shop &bull;</h1>

    <div class="shops-container">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <a href="https://www.amazon.com" target="_blank">Visit Amazon</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay">
            <a href="https://www.ebay.com" target="_blank">Visit eBay</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; kyenjai 2026
    </div>

</body>
</html>
