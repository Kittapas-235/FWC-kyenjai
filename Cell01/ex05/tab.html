<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            height: 50vh;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            text-align: center;
            font-size: 24px;
            font-family: sans-serif;
        }
        .cell-one {
            background-color: #4CAF50;
            color: white;
        }
        .cell-two {
            background-color: #2196F3;
            color: white;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell-one">First cell</td>
            <td class="cell-two">Second cell</td>
        </tr>
    </table>

</body>
</html>
